# ============================================================
# FRC Alliance-Keypoint Pipeline — central config
# ============================================================
# Everything downstream reads from this file so there is a single
# source of truth. Secrets come from environment variables, never
# checked in here.

label_studio:
  base_url: "https://app.humansignal.com"
  project_id: 260156
  # API key is read from env: LS_API_KEY
  # Label names must match the labeling config EXACTLY.
  label_blue: "Blue robot center"
  label_red: "Red robot center"
  from_name: "kp"      # <KeyPointLabels name="kp" ...>
  to_name: "image"     # toName="image"
  model_version: "hrnet-heatmap-v1"

r2:
  # Cloudflare R2 is S3-compatible. Credentials from env:
  #   R2_ENDPOINT_URL, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
  # Image refs in Label Studio are resolver URLs; the true key is the
  # base64 fileuri, decoding to s3://assets/sprocketstats/<round>/<eventcode>_<match>/frame_*.jpg
  bucket: "assets"
  # Local mirror where images are synced for training.
  local_image_root: "data/frc/images"

classes:
  # Channel index -> alliance. Order is FIXED; heatmap channel 0 is blue.
  - blue
  - red

heatmap:
  input_size: [768, 768]     # network input (H, W). High-res for small points.
  output_stride: 4           # heatmap is input/stride => 192x192
  sigma: 2.0                 # Gaussian spread of target peak, in heatmap px
  # Peak decoding at inference
  peak_threshold: 0.3        # min heatmap value to accept a detection
  nms_kernel: 5              # local-max window (px in heatmap space)
  max_instances: 20          # up to 18 robots in a 3-way split-screen + slack

train:
  backbone: "hrnet_w32"
  batch_size: 4             # per-step batch that fits 16GB at 768x768 (HRNet
                           # keeps hi-res feature maps, so activations are huge)
  grad_accum: 6            # accumulate 6 steps => effective batch of 24
  epochs: 80
  base_lr: 0.0005
  weight_decay: 0.0001
  num_workers: 8
  val_frac: 0.15            # fraction of MATCHES held out for validation
  seed: 42
  amp: true                  # mixed precision

paths:
  work_dir: "data/frc/work"
  export_dir: "data/frc/exports"
  checkpoints: "data/frc/checkpoints"
